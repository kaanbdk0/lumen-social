name: Reel Post (every 2 days)

on:
  # Scheduling is handled by an external cron (cron-job.org) that calls
  # workflow_dispatch daily. The gate step below keeps the every-2-days
  # cadence; pass force=true to post on an off-day.
  workflow_dispatch:
    inputs:
      force:
        description: "Force a post even on an off-day"
        type: boolean
        default: false
      langs:
        description: "Comma-separated langs to render/post (blank = all). Use to re-post only specific languages."
        type: string
        default: ""

permissions:
  contents: write

env:
  POST_START: "2026-06-07"

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Post every 2 days with no calendar drift: only proceed when the number
      # of whole days since POST_START is even (manual runs always proceed).
      - name: Gate (is today a post day?)
        id: gate
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "post_day=true" >> "$GITHUB_OUTPUT"; echo "Force input → posting."; exit 0
          fi
          days=$(( ( $(date -u +%s) - $(date -u -d "${POST_START}" +%s) ) / 86400 ))
          if [ $(( days % 2 )) -eq 0 ]; then
            echo "post_day=true" >> "$GITHUB_OUTPUT"; echo "Day ${days} since start → post day."
          else
            echo "post_day=false" >> "$GITHUB_OUTPUT"; echo "Day ${days} since start → skip."
          fi

      - name: Setup Node 20
        if: steps.gate.outputs.post_day == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.post_day == 'true'
        run: npm ci

      - name: Install ffmpeg and multilingual fonts
        if: steps.gate.outputs.post_day == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-color-emoji fonts-noto-core fonts-noto-extra
          fc-cache -fv

      - name: Install Chromium for Remotion
        if: steps.gate.outputs.post_day == 'true'
        run: npx remotion browser ensure

      - name: Validate data (constitution)
        if: steps.gate.outputs.post_day == 'true'
        run: node scripts/validate-data.js

      - name: Set date
        if: steps.gate.outputs.post_day == 'true'
        id: date
        run: echo "DATE=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Render reels (all languages, random quote)
        if: steps.gate.outputs.post_day == 'true'
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: |
          ARGS="${{ steps.date.outputs.DATE }}"
          LANGS="${{ github.event.inputs.langs }}"
          if [ -n "$LANGS" ]; then ARGS="$ARGS --langs $LANGS"; echo "Rendering only: $LANGS"; fi
          node render-post.js $ARGS

      - name: Verify reels exist
        if: steps.gate.outputs.post_day == 'true'
        run: |
          DATE="${{ steps.date.outputs.DATE }}"
          shopt -s nullglob
          files=(out/posts/${DATE}/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No reels rendered for ${DATE}."; exit 1; fi
          echo "✅ ${#files[@]} reel(s) rendered."

      # Email the EN reel to Kaan every reel day — Mac-independent delivery.
      # Compresses to ~6MB so it fits comfortably under Gmail's 25MB limit.
      - name: Prepare EN reel for email
        if: steps.gate.outputs.post_day == 'true' && github.event.inputs.langs == ''
        continue-on-error: true
        env:
          DATE: ${{ steps.date.outputs.DATE }}
        run: |
          SRC="out/posts/$DATE/lumen_post_${DATE}_en.mp4"
          ffmpeg -y -i "$SRC" -vf "scale=-2:1280" -c:v libx264 -preset veryfast -b:v 2200k -c:a aac -b:a 96k email_en.mp4
          {
            echo "Lumen — gunun EN reeli ($DATE)"
            echo ""
            echo "--- Caption (manuel paylasim icin) ---"
            node -e "const m=require('./out/posts/'+process.env.DATE+'/meta.json');process.stdout.write((m.captions&&m.captions.en)||'')"
          } > email_body.txt
          ls -la email_en.mp4 email_body.txt

      - name: Email EN reel to Kaan
        if: steps.gate.outputs.post_day == 'true' && github.event.inputs.langs == ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: kaanbudak0@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Lumen <kaanbudak0@gmail.com>
          to: kaanbudak0@gmail.com
          subject: "🌙 Lumen — günün EN reel'i (${{ steps.date.outputs.DATE }})"
          body: file://email_body.txt
          attachments: email_en.mp4

      - name: Upload reels as artifacts
        if: steps.gate.outputs.post_day == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ steps.date.outputs.DATE }}
          path: out/posts/${{ steps.date.outputs.DATE }}/
          retention-days: 7

      # Host reels via a temp GitHub release so Instagram can fetch by URL.
      - name: Create temp release for video hosting
        if: steps.gate.outputs.post_day == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DATE="${{ steps.date.outputs.DATE }}"
          files=(out/posts/${DATE}/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No reels to host."; exit 1; fi
          gh release create "reel-${DATE}" --title "Reel ${DATE}" --notes "Auto-generated reels. Will be cleaned up." || true
          for f in "${files[@]}"; do gh release upload "reel-${DATE}" "$f" --clobber; done

      - name: Post to Instagram Reels (all languages)
        if: steps.gate.outputs.post_day == 'true'
        env:
          INSTAGRAM_ACCOUNTS: ${{ secrets.INSTAGRAM_ACCOUNTS }}
          VIDEO_BASE_URL: "https://github.com/${{ github.repository }}/releases/download/reel-${{ steps.date.outputs.DATE }}"
        run: node scripts/post-reel-instagram.js ${{ steps.date.outputs.DATE }}

      - name: Post to YouTube Shorts (EN)
        if: steps.gate.outputs.post_day == 'true' && github.event.inputs.langs == ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/post-reel-youtube.js ${{ steps.date.outputs.DATE }}

      - name: Cleanup temp release
        if: always() && steps.gate.outputs.post_day == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.DATE }}"
          gh release delete "reel-${DATE}" -y --cleanup-tag 2>/dev/null || true
