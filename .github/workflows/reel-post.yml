name: Reel Prepare (every 2 days → Telegram approval)

# Renders today's voiced reel for every language, checks each voice track with
# speech-to-text, and sends it to Kaan on Telegram. Nothing is posted here: the
# reel-approve workflow posts a language only after Kaan presses "Paylaş".
on:
  # Scheduling is handled by an external cron (cron-job.org) that calls
  # workflow_dispatch daily; the gate keeps the every-2-days cadence.
  workflow_dispatch:
    inputs:
      force:
        description: "Prepare even on an off-day"
        type: boolean
        default: false
      langs:
        description: "Comma-separated langs (blank = all)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: reel-prepare
  cancel-in-progress: false

env:
  POST_START: "2026-06-07"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate (post day? already prepared today?)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="$(TZ=Europe/Istanbul date +%F)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ -n "${{ github.event.inputs.langs }}" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "Manual run → preparing."; exit 0
          fi
          days=$(( ( $(date -u -d "$DATE" +%s) - $(date -u -d "${POST_START}" +%s) ) / 86400 ))
          if [ $(( days % 2 )) -ne 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "Off-day."; exit 0; fi
          if gh release view "approve-$DATE" >/dev/null 2>&1; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Already prepared today."; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies, ffmpeg, fonts, Chromium
        if: steps.gate.outputs.go == 'true'
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f
          npx remotion browser ensure

      - name: Render, check and send to Telegram
        if: steps.gate.outputs.go == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="${{ steps.gate.outputs.date }}"
          [ -n "${{ github.event.inputs.langs }}" ] && ARGS="$ARGS --langs ${{ github.event.inputs.langs }}"
          python3 scripts/approval.py prepare $ARGS

      - name: Start the approval watcher
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run reel-approve.yml
