name: Reel Post (every 2 days)

on:
  schedule:
    # Runs daily, but the "gate" step only proceeds every 2nd day from POST_START.
    - cron: '0 8 * * *'
  workflow_dispatch: # Manual trigger always posts

permissions:
  contents: write

env:
  POST_START: "2026-06-07"

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Post every 2 days with no calendar drift: only proceed when the number
      # of whole days since POST_START is even (manual runs always proceed).
      - name: Gate (is today a post day?)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "post_day=true" >> "$GITHUB_OUTPUT"; echo "Manual run → posting."; exit 0
          fi
          days=$(( ( $(date -u +%s) - $(date -u -d "${POST_START}" +%s) ) / 86400 ))
          if [ $(( days % 2 )) -eq 0 ]; then
            echo "post_day=true" >> "$GITHUB_OUTPUT"; echo "Day ${days} since start → post day."
          else
            echo "post_day=false" >> "$GITHUB_OUTPUT"; echo "Day ${days} since start → skip."
          fi

      - name: Setup Node 20
        if: steps.gate.outputs.post_day == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.post_day == 'true'
        run: npm ci

      - name: Install ffmpeg and multilingual fonts
        if: steps.gate.outputs.post_day == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-color-emoji fonts-noto-core fonts-noto-extra
          fc-cache -fv

      - name: Install Chromium for Remotion
        if: steps.gate.outputs.post_day == 'true'
        run: npx remotion browser ensure

      - name: Validate data (constitution)
        if: steps.gate.outputs.post_day == 'true'
        run: node scripts/validate-data.js

      - name: Set date
        if: steps.gate.outputs.post_day == 'true'
        id: date
        run: echo "DATE=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Render reels (all languages, random quote)
        if: steps.gate.outputs.post_day == 'true'
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: node render-post.js ${{ steps.date.outputs.DATE }}

      - name: Verify reels exist
        if: steps.gate.outputs.post_day == 'true'
        run: |
          DATE="${{ steps.date.outputs.DATE }}"
          shopt -s nullglob
          files=(out/posts/${DATE}/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No reels rendered for ${DATE}."; exit 1; fi
          echo "✅ ${#files[@]} reel(s) rendered."

      - name: Upload reels as artifacts
        if: steps.gate.outputs.post_day == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ steps.date.outputs.DATE }}
          path: out/posts/${{ steps.date.outputs.DATE }}/
          retention-days: 7

      # Host reels via a temp GitHub release so Instagram can fetch by URL.
      - name: Create temp release for video hosting
        if: steps.gate.outputs.post_day == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DATE="${{ steps.date.outputs.DATE }}"
          files=(out/posts/${DATE}/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No reels to host."; exit 1; fi
          gh release create "reel-${DATE}" --title "Reel ${DATE}" --notes "Auto-generated reels. Will be cleaned up." || true
          for f in "${files[@]}"; do gh release upload "reel-${DATE}" "$f" --clobber; done

      - name: Post to Instagram Reels (all languages)
        if: steps.gate.outputs.post_day == 'true'
        env:
          INSTAGRAM_ACCOUNTS: ${{ secrets.INSTAGRAM_ACCOUNTS }}
          VIDEO_BASE_URL: "https://github.com/${{ github.repository }}/releases/download/reel-${{ steps.date.outputs.DATE }}"
        run: node scripts/post-reel-instagram.js ${{ steps.date.outputs.DATE }}

      - name: Post to YouTube Shorts (EN)
        if: steps.gate.outputs.post_day == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/post-reel-youtube.js ${{ steps.date.outputs.DATE }}

      - name: Cleanup temp release
        if: always() && steps.gate.outputs.post_day == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.DATE }}"
          gh release delete "reel-${DATE}" -y --cleanup-tag 2>/dev/null || true
