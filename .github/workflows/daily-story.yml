name: Daily Story Prepare (→ Telegram approval)

# Renders today's quote-of-the-day story for every language, checks each voice with
# speech-to-text, and sends it to Kaan on Telegram. Nothing is posted here: the
# reel-approve watcher posts a language's Instagram story (EN also YouTube Shorts)
# only after Kaan presses "Paylaş".
on:
  # Scheduling is handled by an external cron (cron-job.org) that calls
  # workflow_dispatch daily. GitHub's built-in scheduler was silently
  # dropping scheduled runs, so it is no longer used here.
  workflow_dispatch:
    inputs:
      langs:
        description: "Comma-separated langs (blank = all)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: story-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    # apt mirrors are sometimes very slow (2026-10-27 hit the old 45 min limit mid-install)
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate (already prepared today?)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="$(date +%Y-%m-%d)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ -z "${{ github.event.inputs.langs }}" ] && gh release view "story-approve-$DATE" >/dev/null 2>&1; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Already prepared today."; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies, ffmpeg, fonts, Chromium
        if: steps.gate.outputs.go == 'true'
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f
          npx remotion browser ensure

      # Constitution gate: refuse to start if data is broken (missing bust
      # image, orphan quote, etc.) so we never silently render 0 videos.
      - name: Validate data (constitution)
        if: steps.gate.outputs.go == 'true'
        run: node scripts/validate-data.js

      - name: Render, check and send to Telegram
        if: steps.gate.outputs.go == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_FEMALE_VOICE_ID: ${{ secrets.ELEVENLABS_FEMALE_VOICE_ID }}
          FFMPEG_PATH: /usr/bin/ffmpeg
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="${{ steps.gate.outputs.date }}"
          [ -n "${{ github.event.inputs.langs }}" ] && ARGS="$ARGS --langs ${{ github.event.inputs.langs }}"
          python3 scripts/approval.py prepare-story $ARGS

      - name: Start the approval watcher
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run reel-approve.yml
