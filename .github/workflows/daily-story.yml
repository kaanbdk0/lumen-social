name: Daily Story Render & Post

on:
  schedule:
    # Every day at 07:00 UTC (10:00 TR time)
    - cron: '0 7 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg and multilingual fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-color-emoji
          sudo apt-get install -y fonts-noto-core fonts-noto-extra
          fc-cache -fv

      - name: Install Chromium for Remotion
        run: npx remotion browser ensure

      - name: Set date
        id: date
        run: echo "DATE=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Render daily videos (all languages)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: node render-daily.js

      - name: Upload videos as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-videos-${{ steps.date.outputs.DATE }}
          path: out/
          retention-days: 7

      - name: Post to YouTube Shorts
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/post-youtube.js ${{ steps.date.outputs.DATE }}

      # Host videos temporarily via GitHub release (needed for Instagram API)
      - name: Create temp release for video hosting
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.DATE }}"
          gh release create "daily-${DATE}" \
            --title "Daily ${DATE}" \
            --notes "Auto-generated for daily posting. Will be cleaned up." \
            || true
          for f in out/${DATE}/*.mp4; do
            [ -f "$f" ] && gh release upload "daily-${DATE}" "$f" --clobber
          done

      - name: Post to Instagram Stories
        if: success()
        env:
          INSTAGRAM_ACCOUNTS: ${{ secrets.INSTAGRAM_ACCOUNTS }}
          VIDEO_BASE_URL: "https://github.com/${{ github.repository }}/releases/download/daily-${{ steps.date.outputs.DATE }}"
        run: node scripts/post-instagram.js ${{ steps.date.outputs.DATE }}

      - name: Post to TikTok
        if: success()
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: node scripts/post-tiktok.js ${{ steps.date.outputs.DATE }}

      # Clean up temp release after posting
      - name: Cleanup temp release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.DATE }}"
          gh release delete "daily-${DATE}" -y --cleanup-tag 2>/dev/null || true
