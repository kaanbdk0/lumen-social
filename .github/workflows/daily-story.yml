name: Daily Story Render

on:
  schedule:
    # Every day at 07:00 UTC (10:00 TR time)
    - cron: '0 7 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Chromium for Remotion
        run: npx remotion browser ensure

      - name: Render daily videos (all languages)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: node render-daily.js

      - name: Upload videos as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-videos-${{ github.run_id }}
          path: out/
          retention-days: 7

      - name: Post to Instagram
        if: success()
        env:
          INSTAGRAM_ACCOUNTS: ${{ secrets.INSTAGRAM_ACCOUNTS }}
        run: node scripts/post-instagram.js

      - name: Post to TikTok
        if: success()
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: node scripts/post-tiktok.js

      - name: Post to YouTube
        if: success()
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: node scripts/post-youtube.js
